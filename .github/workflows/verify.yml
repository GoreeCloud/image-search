name: Verify
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit all dependencies for security advisories
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - name: Test manual provider CORS probe without network access
        run: npm run test:provider-cors
      - name: Check mobile touch target CSS geometry
        run: npm run test:mobile-touch
      - run: npm run build

  linux:
    name: Linux desktop bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- build
      - name: Verify native Linux package integrity
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$DEB" && test -s "$DEB"
          test -n "$APPIMAGE" && test -s "$APPIMAGE"
          dpkg-deb --field "$DEB" Package Architecture Version
          dpkg-deb --contents "$DEB" | grep -F 'usr/bin/image-search'
          file "$APPIMAGE"
      - uses: actions/upload-artifact@v6
        with:
          name: image-search-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    name: Android debug packaging (not update-signed)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - run: bash scripts/prepare-android.sh
      - run: npm run tauri -- android build --debug --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
      - name: Test native public-only DNS policy
        run: src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:testArmDebugUnitTest --no-daemon
      - name: Verify Android APK identity and signer
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          AAPT_BIN="${ANDROID_HOME}/build-tools/35.0.0/aapt" \
            APKSIGNER_BIN="${ANDROID_HOME}/build-tools/35.0.0/apksigner" \
            bash scripts/verify-android-apk.sh "$APK"
      - name: Check Android 16 KiB ELF and APK ZIP alignment
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          PATH="${ANDROID_HOME}/build-tools/35.0.0:$PATH" bash scripts/verify-android-16k.sh "$APK"
      - uses: actions/upload-artifact@v6
        with:
          name: image-search-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
