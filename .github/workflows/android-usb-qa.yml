name: Android Side-by-Side QA
on:
  pull_request:

permissions:
  contents: read

jobs:
  android_qa:
    if: startsWith(github.head_ref, 'qa/') || startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/')
    name: Isolated USB QA APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Prepare per-run isolated QA package identity
        run: |
          node -e "const fs = require('fs'); const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.qa.conf.json', 'utf8')); cfg.identifier += process.env.GITHUB_RUN_ID; fs.writeFileSync('src-tauri/tauri.qa.run.json', JSON.stringify(cfg)); console.log('Isolated QA package:', cfg.identifier);"
      - name: Generate isolated Android package
        run: npm run tauri -- android init --config src-tauri/tauri.qa.run.json --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - name: Apply inset handling under QA package
        run: |
          bash scripts/prepare-android.sh
          ACTIVITY=$(find src-tauri/gen/android/app/src/main/java -name MainActivity.kt -print -quit)
          test -n "$ACTIVITY"
          sed -i "s/^package com\.goreecloud\.imagesearch$/package com.goreecloud.imagesearch.qa${GITHUB_RUN_ID}/" "$ACTIVITY"
          grep -F "package com.goreecloud.imagesearch.qa${GITHUB_RUN_ID}" "$ACTIVITY"
      - name: Build QA APK
        run: npm run tauri -- android build --debug --target aarch64 --config src-tauri/tauri.qa.run.json --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
      - name: Test native public-only DNS policy in isolated QA package
        run: src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:testArmDebugUnitTest --no-daemon
      - name: Verify QA package and certificate
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          EXPECTED_PACKAGE="com.goreecloud.imagesearch.qa${GITHUB_RUN_ID}" \
            AAPT_BIN="${ANDROID_HOME}/build-tools/35.0.0/aapt" \
            APKSIGNER_BIN="${ANDROID_HOME}/build-tools/35.0.0/apksigner" \
            bash scripts/verify-android-apk.sh "$APK"
      - name: Check Android 16 KiB ELF and APK ZIP alignment
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          PATH="${ANDROID_HOME}/build-tools/35.0.0:$PATH" bash scripts/verify-android-16k.sh "$APK"
      - uses: actions/upload-artifact@v6
        with:
          name: image-search-usb-qa-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
